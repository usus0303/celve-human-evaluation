<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CELVE · 180-image Review</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#172b43;--muted:#6b7f92;--line:#dce4ea;--primary:#12617a;--soft:#eef5f7}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink)}button,select,input{font:inherit}button,a{cursor:pointer}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:20}.brand{display:flex;gap:11px;align-items:center}.brand b{font-size:21px;letter-spacing:1px}.brand span{font-size:13px;color:var(--muted)}.back{border:1px solid #cbd7df;border-radius:7px;padding:9px 13px;color:#315168;text-decoration:none;background:#fff}.main{max-width:1500px;margin:auto;padding:28px 34px 60px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:1.5px;color:#708598;font-weight:700}.heading h1{font-size:27px;margin:8px 0 7px}.heading p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.count{display:flex;align-items:baseline;gap:6px;white-space:nowrap}.count strong{font-size:34px;color:var(--primary);font-weight:500}.count span{font-size:13px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:22px}.filters{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.4fr;gap:12px}.filters label{font-size:12px;font-weight:700;color:#60758a}.filters select,.filters input{width:100%;height:42px;margin-top:6px;border:1px solid #cbd7df;border-radius:7px;padding:0 11px;background:#fff;color:#24475e}.summary{margin:15px 0 0;font-size:12px;color:#718597}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:18px}.card{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;min-width:0}.thumb{position:relative;width:100%;aspect-ratio:4/3;padding:0;border:0;background:#edf2f5;display:block}.thumb img{width:100%;height:100%;object-fit:contain;display:block}.num{position:absolute;left:7px;top:7px;background:#fffffff0;border:1px solid var(--line);border-radius:5px;padding:3px 6px;font:12px ui-monospace,monospace}.detail-badge{position:absolute;right:7px;bottom:7px;background:#fffffff0;border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:10px;color:#34566c}.card-body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:4px}.card-body strong{font-size:13px}.card-body span{font-size:11px;color:#718597;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sets{display:flex;gap:5px;margin-top:4px}.sets i{font-style:normal;font-size:10px;border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:#587084}.pager{display:flex;align-items:center;justify-content:space-between;margin-top:20px;color:#687e91;font-size:13px}.pager>div{display:flex;align-items:center;gap:10px}.btn{border:1px solid #cbd7df;border-radius:7px;background:#fff;color:#274b62;min-height:38px;padding:8px 12px}.btn:disabled{opacity:.4;cursor:not-allowed}.empty{text-align:center;color:#718597;padding:50px 10px;border:1px dashed #cad6df;border-radius:8px;margin-top:18px}.loading,.error{max-width:720px;margin:100px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:36px}.error{color:#9c3131}.modal{position:fixed;inset:0;background:#102a3b99;display:none;align-items:center;justify-content:center;padding:22px;z-index:100}.modal.open{display:flex}.dialog{width:min(1400px,97vw);max-height:94vh;overflow:auto;background:#fff;border-radius:12px;padding:22px;box-shadow:0 20px 70px #0c203550}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.dialog-head h2{margin:0;font-size:22px}.dialog-head p{margin:6px 0 0;font-size:11px;color:#7b8d9d;overflow-wrap:anywhere}.close{border:0;background:#eef3f6;width:36px;height:36px;border-radius:50%;font-size:22px;color:#567083}.modal-nav{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:12px 0}.modal-nav span{font-size:12px;color:#708597}.detail-top{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(330px,.88fr);gap:22px}.original-frame{position:relative;background:#edf2f5;border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:58vh}.original-frame img{width:100%;height:100%;object-fit:contain;display:block}.bbox{position:absolute;border:3px solid var(--primary);background:#12617a18;pointer-events:none;display:none}.meta-line{font-size:12px;color:#6f8294;margin:8px 0 0}.country-panel{border:1px solid var(--line);background:#fafcfd;border-radius:9px;padding:18px}.country-row{padding:12px 0;border-bottom:1px solid #e6ebef}.country-row:first-child{padding-top:0}.country-row:last-child{border:0;padding-bottom:0}.country-row>span{display:block;text-transform:uppercase;letter-spacing:.6px;font-size:10px;color:#7d8f9f;margin-bottom:7px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;padding:4px 7px;border:1px solid #d8e1e7;border-radius:5px;background:#eef3f6;color:#47657a}.chips.refined .chip{background:#e8f4f4;border-color:#bad8d4;color:var(--primary)}.desc{font-size:13px;line-height:1.7;color:#435f74;max-height:180px;overflow:auto;margin:0}.patch-title{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-top:1px solid #e1e8ed;margin-top:22px;padding-top:17px}.patch-title strong{font-size:16px}.patch-title span{font-size:11px;color:#758899;text-align:right}.patch-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px;margin-top:12px}.patch{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}.patch:hover{border-color:var(--primary);box-shadow:0 0 0 1px #12617a22}.patch img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#eff3f6}.patch-foot{padding:7px;display:flex;justify-content:space-between;gap:6px}.patch-foot span{font-size:10px;color:#647b8d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.patch-foot span:last-child{color:var(--primary);text-align:right}.auth-note{font-size:12px;color:#768a9a;margin-top:12px}@media(max-width:1150px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.patch-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:850px){.top{padding:0 18px}.main{padding:24px 18px}.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.detail-top{grid-template-columns:1fr}.patch-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.patch-title{align-items:flex-start;flex-direction:column}.patch-title span{text-align:left}}@media(max-width:540px){.brand span{display:none}.heading{flex-direction:column}.filters{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.panel{padding:15px}.patch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pager{align-items:flex-start;flex-direction:column;gap:12px}.modal{padding:6px}.dialog{width:99vw;padding:15px}.modal-nav{justify-content:space-between}.modal-nav span{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><b>CELVE</b><span>Researcher · 180-image browser</span></div><a class="back" href="/">← Researcher view</a></header>
<main id="app" class="main"><div class="loading">평가 데이터를 불러오는 중입니다…</div></main>
<div id="modal" class="modal" aria-hidden="true"><div id="dialog" class="dialog"></div></div>
<script>
const PAGE_SIZE=20;let data=null,filtered=[],page=0,selectedIndex=-1;const app=document.getElementById('app'),modal=document.getElementById('modal'),dialog=document.getElementById('dialog');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const media=u=>'/' + u;
function name(code){const c=data.countries.find(x=>x.id===code);return c?`${c.id} · ${c.name}`:(code||'—')}
function categoryLabel(c){return ({architecture:'architecture',clothes:'clothes',cuisine:'cuisine',game:'game',tool_instrument:'tool & instrument'})[c]||c||'—'}
async function getJSON(url,headers={}){const r=await fetch(url,{credentials:'same-origin',headers});let body={};try{body=await r.json()}catch{}if(!r.ok)throw new Error(body.error||`HTTP ${r.status}`);return body}
async function boot(){try{const session=await getJSON('/api/session');if(session.role!=='researcher'){app.innerHTML='<div class="error">Researcher 계정으로만 볼 수 있습니다.<div class="auth-note"><a href="/">평가 페이지로 돌아가기</a></div></div>';return}const admin=await getJSON('/api/admin');data=await getJSON('/api/admin/review',{'X-Study-ID':admin.studyId});renderShell();applyFilters()}catch(e){if(String(e.message).includes('sign in')||String(e.message).includes('401'))location.href='/';else app.innerHTML=`<div class="error">${esc(e.message)}<div class="auth-note"><a href="/">Researcher view로 돌아가기</a></div></div>`}}
function renderShell(){const regions=[...new Map(data.items.filter(i=>i.region_id).map(i=>[i.region_id,i.region_name||i.region_id]))];const cats=[...new Set(data.items.map(i=>i.category).filter(Boolean))].sort();app.innerHTML=`<div class="heading"><div><div class="eyebrow">RESEARCHER DATA BROWSER</div><h1>인간평가 180장 전체 보기</h1><p>실제 인간평가에 사용된 원본 이미지와 전체 추출 패치를 확인합니다.<br>정답(Source/GT) 국가, CP 후보 국가, verification 이후 남은 국가와 국가별 supporting patch도 함께 표시합니다.</p></div><div class="count"><strong id="filteredCount">${data.total}</strong><span>/ ${data.total} images</span></div></div><section class="panel"><div class="filters"><label>정답 국가<select id="country"><option value="all">전체 9개국</option>${data.countries.map(c=>`<option value="${c.id}">${esc(c.id)} · ${esc(c.name)}</option>`).join('')}</select></label><label>지역 / 평가자<select id="region"><option value="all">전체 지역</option>${regions.map(([id,n])=>`<option value="${esc(id)}">${esc(n)}</option>`).join('')}</select></label><label>카테고리<select id="category"><option value="all">전체 카테고리</option>${cats.map(c=>`<option value="${esc(c)}">${esc(categoryLabel(c))}</option>`).join('')}</select></label><label>검색<input id="query" placeholder="번호 또는 source_key"></label></div><p class="summary">국가를 선택하면 해당 국가의 실제 평가 예시 20장을 한 번에 확인할 수 있습니다. 전체 보기에서는 20장씩 9페이지로 이동합니다.</p><div id="grid"></div></section>`;['country','region','category'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{page=0;applyFilters()}));document.getElementById('query').addEventListener('input',()=>{page=0;applyFilters()})}
function applyFilters(){const country=document.getElementById('country').value,region=document.getElementById('region').value,category=document.getElementById('category').value,q=document.getElementById('query').value.trim().toLowerCase();filtered=data.items.filter(i=>(country==='all'||i.source_country===country)&&(region==='all'||i.region_id===region)&&(category==='all'||i.category===category)&&(!q||String(i.position).includes(q)||(i.source_key||'').toLowerCase().includes(q)));document.getElementById('filteredCount').textContent=filtered.length;const pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));if(page>=pages)page=pages-1;renderGrid()}
function renderGrid(){const host=document.getElementById('grid'),pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE)),visible=filtered.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);if(!visible.length){host.innerHTML='<div class="empty">조건에 맞는 이미지가 없습니다.</div>';return}host.innerHTML=`<div class="grid">${visible.map(i=>`<article class="card"><button class="thumb" data-open="${i.image_id}"><img src="${esc(media(i.original_image))}" loading="lazy" alt="image ${i.position}"><span class="num">#${String(i.position).padStart(3,'0')}</span><span class="detail-badge">상세 · patches</span></button><div class="card-body"><strong>${esc(name(i.source_country))}</strong><span>${esc(i.region_name||'Shared')}${i.evaluator?` · evaluator ${esc(i.evaluator)}`:''}</span><span>${esc(categoryLabel(i.category))} · ${i.patches.length} patches</span><div class="sets"><i>CP ${i.cp_countries.length}</i><i>Refined ${i.refined_countries.length}</i></div></div></article>`).join('')}</div><div class="pager"><span>${page*PAGE_SIZE+1}–${Math.min((page+1)*PAGE_SIZE,filtered.length)} / ${filtered.length}</span><div><button class="btn" id="prev" ${page===0?'disabled':''}>← 이전</button><span>${page+1} / ${pages}</span><button class="btn" id="next" ${page>=pages-1?'disabled':''}>다음 →</button></div></div>`;host.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));document.getElementById('prev').onclick=()=>{if(page>0){page--;renderGrid();scrollTo({top:0,behavior:'smooth'})}};document.getElementById('next').onclick=()=>{if(page<pages-1){page++;renderGrid();scrollTo({top:0,behavior:'smooth'})}}}
function chips(arr,cls=''){return `<div class="chips ${cls}">${arr.length?arr.map(c=>`<span class="chip">${esc(c)}</span>`).join(''):'<span style="font-size:12px;color:#8596a3">none</span>'}</div>`}
function openDetail(id){selectedIndex=filtered.findIndex(i=>i.image_id===id);renderDetail();modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeDetail(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';selectedIndex=-1}
function renderDetail(){const i=filtered[selectedIndex];if(!i){closeDetail();return}const supportByPatch={};Object.entries(i.retained_patches_by_country||{}).forEach(([c,ids])=>ids.forEach(pid=>(supportByPatch[pid]||(supportByPatch[pid]=[])).push(c)));dialog.innerHTML=`<div class="dialog-head"><div><h2>#${String(i.position).padStart(3,'0')} · ${esc(name(i.source_country))}</h2><p>${esc(i.source_key)}</p></div><button class="close" id="close">×</button></div><div class="modal-nav"><button class="btn" id="mPrev" ${selectedIndex<=0?'disabled':''}>← 이전 이미지</button><span>${selectedIndex+1} / ${filtered.length}</span><button class="btn" id="mNext" ${selectedIndex>=filtered.length-1?'disabled':''}>다음 이미지 →</button></div><div class="detail-top"><div><div class="original-frame" id="originalFrame" style="aspect-ratio:${i.width}/${i.height}"><img src="${esc(media(i.original_image))}" alt="original"><span class="bbox" id="bbox"></span></div><p class="meta-line">${esc(i.region_name||'Shared')} ${i.evaluator?`· evaluator ${esc(i.evaluator)} `:''}· ${esc(categoryLabel(i.category))} · ${i.patches.length} patches</p></div><aside class="country-panel"><div class="country-row"><span>Source / GT country</span><strong>${esc(name(i.source_country))}</strong></div><div class="country-row"><span>CP candidates (${i.cp_countries.length})</span>${chips(i.cp_countries)}</div><div class="country-row"><span>After verification (${i.refined_countries.length})</span>${chips(i.refined_countries,'refined')}</div><div class="country-row"><span>Generated description</span><p class="desc">${esc(i.description)}</p></div></aside></div><div class="patch-title"><strong>전체 추출 패치 ${i.patches.length}개</strong><span>패치에 마우스를 올리면 원본 bbox가 표시됩니다. 오른쪽 국가는 verification에서 해당 패치를 supporting evidence로 남긴 국가입니다.</span></div><div class="patch-grid">${i.patches.map((p,n)=>`<div class="patch" data-patch="${esc(p.patch_id)}" data-box='${JSON.stringify(p.box_xyxy||null)}'><img src="${esc(media(p.image))}" loading="lazy" alt="patch ${n+1}"><div class="patch-foot"><span>P${String(n+1).padStart(2,'0')}</span><span>${supportByPatch[p.patch_id]?.length?esc(supportByPatch[p.patch_id].join(' · ')):'not retained'}</span></div></div>`).join('')}</div>`;document.getElementById('close').onclick=closeDetail;document.getElementById('mPrev').onclick=()=>{if(selectedIndex>0){selectedIndex--;renderDetail()}};document.getElementById('mNext').onclick=()=>{if(selectedIndex<filtered.length-1){selectedIndex++;renderDetail()}};const bbox=document.getElementById('bbox');dialog.querySelectorAll('[data-patch]').forEach(el=>{el.addEventListener('mouseenter',()=>showBox(JSON.parse(el.dataset.box),i,bbox));el.addEventListener('mouseleave',()=>bbox.style.display='none')})}
function showBox(box,item,bbox){if(!box){bbox.style.display='none';return}const [x1,y1,x2,y2]=box;bbox.style.left=(x1/item.width*100)+'%';bbox.style.top=(y1/item.height*100)+'%';bbox.style.width=((x2-x1)/item.width*100)+'%';bbox.style.height=((y2-y1)/item.height*100)+'%';bbox.style.display='block'}
modal.addEventListener('click',e=>{if(e.target===modal)closeDetail()});document.addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='Escape')closeDetail();if(e.key==='ArrowLeft'&&selectedIndex>0){selectedIndex--;renderDetail()}if(e.key==='ArrowRight'&&selectedIndex<filtered.length-1){selectedIndex++;renderDetail()}});boot();
</script>
</body></html>
